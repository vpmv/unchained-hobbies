# reference value
application:
    name: horse riding log

    # symfony style form definition
    #   input identifier => config
    fields:
        date:
            type: date
            year_max: 1
            required: true
            default: today
#            public: false
        time:
            type: time
            dashboard:
                visibility: detail
        riding_school:
            source: stables
            required: true
            dashboard:
                visibility: detail
        #stables:
        #    label: Riding school
        #    source: stables.name
        #    dashboard:
        #        visibility: detail
        horse:
            source: horses.photo
            required: true
            condition: riding_school
            group_source: stables
        instructor:
            type: choice
            source: instructors.name
            required: true
            public: false
            condition: riding_school
            group_source: stables
        arena:
            type: choice
            options: [ inside, "outside_covered", "outside_long", "outside_show", "contest", "free_range" ]
            default: 0
            required: true
            dashboard:
                visibility: large
        riders:
            source: riders.name
                #source: riders
                #fields: [name, shorthand] # todo: virtual column
            required: false
            multiple: true
            public: false
            dashboard:
                visibility: desktop
            condition: riding_school
        discipline:
            type: choice
            options: [ dressage, jump, carrousel, western, voltige, discipline_other ]
            default: 0
            required: true
            dashboard:
                visibility: detail
        private:
            type: boolean
            label_on: Private lesson
            label_off: Group lesson
            default: 0
            public: false
            dashboard:
                visibility: large
        exercise:
            type: text
            public: false
            dashboard:
                visibility: detail
        rating_ride:
            type: rating
            options: [ 1, 5 ]
            default: 3
            public: false
            dashboard:
                visibility: large
        rating_self:
            type: rating
            label: Rating performance
            options: [ 1, 5 ]
            default: 3
            public: false
            dashboard:
                visibility: detail
        rating_instructions:
            type: rating
            options: [ 1, 5 ]
            default: 3
            public: false
            dashboard:
                visibility: detail
        gear:
            source:
                source: gear
                fields: [brand, name, color]
            multiple: true
            required: false
            public: false
            dashboard:
                visibility: detail
        comment:
            type: text
            maxlength: 250
            public: false
            dashboard:
                visibility: detail

    sources:
        horses:
            application: horses-main
        instructors:
            application: horse-riding-instructors
        riders:
            application: horses-riders
        gear:
            application: horses-gear
        stables:
            application: horses-stables
        #stables:
        #    join_source: horses
        #    application: horses-stables
        #    foreign_column: horses_stables_id

    meta:
        exposes: [date, time]
        sort:
            date: desc
            time: desc

