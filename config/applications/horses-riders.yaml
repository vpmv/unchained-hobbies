# reference value
application:
  category: horses
  routes:
    en: riders
    nl: ruiters

  name: riders

  fields:
    photo:
      type: image
      required: false
      default: ~
      # allow specifying field type with configuration
      _configuration:
        max_file_size: 500k
    stable:
      type: choice
      label: Riding school
      source: stables.name
      required: true
      dashboard:
        visibility: detail
    name:
      type: text
      required: true
    surname:
      type: text
      required: false
    #shorthand:
    #  type: text
    #  ignored: true
    #  pointer:
    #    fields: [surname]
    #  _transform:
    #    text:
    #      abbr: true
      #dashboard: true
      #detail: false
    gender:
      type: choice
      options: [ male, female ]
      required: true
      _configuration:
        icons:
        - value: man
          icon: fa-mars
        - value: woman
          icon: fa-venus
      dashboard:
        visibility: detail
    date_of_birth:
      type: date
      label: Age
      format: ddMMyyyy
      year_min: 99
      year_max: -5 # Y + -5
      required: false
      _transform:
        date:
          round_to: year
      dashboard: large
    height:
      type: number
      _transform:
        number:
          scalar: string
          suffix: cm
      dashboard:
        visibility: detail
    weight:
      type: number
      _transform:
        number:
          scalar: string
          suffix: kg
      dashboard:
        visibility: detail
    date_started:
      type: date
      format: ddMMyyyy
      year_min: 50
      year_max: 0
      required: false
      public: false
      dashboard: detail
    date_stopped:
      type: date
      format: ddMMyyyy
      year_min: 50
      year_max: 5
      required: false
      public: false
      dashboard: detail
    date_first_lesson:
      source: first_seen
      public: false
      dashboard: detail
    date_last_lesson:
      source: last_seen
      public: false
      dashboard: detail
    experience:
      type: text
      pointer:
        fields: [date_started, date_stopped, date_first_lesson, date_last_lesson]
        type: external
      dashboard:
        visibility: large
    riding_level:
      type: text
      maxlength: 50
      required: false
      dashboard:
        visibility: detail
    comment:
      type: text
      maxlength: 250
      public: false
      dashboard: false
    handicap:
      type: choice
      options:
      - autism
      - hearing
      - mental_cognitive
      - mental_memory
      - mental_psyche
      - mental_other
      - physical_amputee
      - physical_muscular
      - physical_back
      - physical_other
      - vision
      - vision_blind
      multiple: true
      required: false
      public: false
      dashboard: false
    count_rides:
      source: count_rides
      type: number
      dashboard:
        visibility: large

  sources:
    first_seen:
      application: horse-riding-log
      function: find_in_min
      field: date
      invert_join: true
    last_seen:
      application: horse-riding-log
      function: find_in_max
      field: date
      invert_join: true
    stables:
      application: horses-stables
    count_rides:
      application: horse-riding-log
      function: count_in



  # Django style meta configuration for model
  meta:
    exposes: [name, surname]
    slug: [name, surname]
    sort:
      surname: asc
      name: asc


  modules:
    detail:
      param: name # todo

  links:
  - application: horse-rides-log
    module: charts
    label: charts

  # fields used in searches
  search:
  - name
  - discipline
  - character
  - comment
